<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!--
  Source for public/og.png (the social preview card). Regenerate with:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
    --headless --hide-scrollbars --force-device-scale-factor=1 \
    --virtual-time-budget=8000 --window-size=1200,630 \
    --screenshot="$PWD/public/og.png" "file://$PWD/tools/og.html"
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #08080a;
    font-family: Inter, system-ui, sans-serif;
    color: #f2f2f5;
    position: relative;
  }

  /* Same two drifting lobes the WebGL field paints, frozen. */
  .lobe {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
  }
  .violet {
    width: 780px; height: 620px;
    left: -80px; top: -260px;
    background: radial-gradient(circle, rgba(122,92,255,0.55), rgba(122,92,255,0) 68%);
  }
  .teal {
    width: 720px; height: 680px;
    right: -140px; bottom: -280px;
    background: radial-gradient(circle, rgba(41,227,193,0.42), rgba(41,227,193,0) 68%);
  }

  /* Faint technical grid, matching the field shader. */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.055) 1px, transparent 1px);
    background-size: 54px 54px;
    mask-image: radial-gradient(ellipse 75% 75% at 50% 45%, #000 25%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse 75% 75% at 50% 45%, #000 25%, transparent 78%);
  }

  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 90% 90% at 50% 45%, transparent 35%, rgba(8,8,10,0.85) 100%);
  }

  .content {
    position: relative;
    height: 100%;
    padding: 62px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .top { display: flex; align-items: center; justify-content: space-between; }

  .wordmark {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 19px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #f2f2f5;
  }

  .available {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 9px 18px;
    border: 1px solid rgba(41,227,193,0.32);
    background: rgba(41,227,193,0.10);
    border-radius: 999px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #29e3c1;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #29e3c1; }

  .eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 15px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #8b8b96;
    margin-bottom: 26px;
  }
  .eyebrow b { color: #7a5cff; font-weight: 400; margin: 0 12px; }

  h1 {
    font-size: 82px;
    font-weight: 500;
    letter-spacing: -0.03em;
    line-height: 0.96;
  }
  h1 .stroke {
    -webkit-text-stroke: 1.5px rgba(242,242,245,0.30);
    color: transparent;
  }

  .bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }

  .name {
    font-size: 25px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .role {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 14px;
    letter-spacing: 0.14em;
    color: #8b8b96;
    margin-top: 9px;
  }

  .url {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 17px;
    letter-spacing: 0.1em;
    color: #f2f2f5;
    padding-bottom: 4px;
    border-bottom: 2px solid #7a5cff;
  }
</style>
</head>
<body>
  <div class="lobe violet"></div>
  <div class="lobe teal"></div>
  <div class="grid"></div>
  <div class="vignette"></div>

  <div class="content">
    <div class="top">
      <span class="wordmark">Mouli</span>
      <span class="available"><span class="dot"></span>Available</span>
    </div>

    <div>
      <div class="eyebrow">Backend &amp; Platform Engineer <b>&bull;</b> Bengaluru, India</div>
      <h1>
        Backend built for the load<br />
        <span class="stroke">you haven't hit yet.</span>
      </h1>
    </div>

    <div class="bottom">
      <div>
        <div class="name">Bandari Sai Mouli</div>
        <div class="role">Backend &bull; ClickHouse &bull; Zero Trust</div>
      </div>
      <div class="url">itsmouli.in</div>
    </div>
  </div>
</body>
</html>
